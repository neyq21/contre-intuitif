# Configuration Fly.io. L'application est construite avec le Dockerfile ;
# la base SQLite vit sur le volume « donnees » monté dans /data.
app = "contre-intuitif"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  CHEMIN_SQLITE = "/data/admin.sqlite"
  DOSSIER_VIDEO = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "donnees"
  destination = "/data"
  initial_size = "1gb"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
